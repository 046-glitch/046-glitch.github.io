<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>
    <style>
        /* Base Styles */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Card Container */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            z-index: 10;
            max-width: 90%;
            width: 400px;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            color: #ff4081;
            margin-bottom: 10px;
            font-size: 2.2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1rem;
            line-height: 1.5;
        }

        /* Button Styles */
        .gift-btn {
            background: linear-gradient(45deg, #ff4081, #f50057);
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 64, 129, 0.4);
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .gift-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px rgba(255, 64, 129, 0.6);
        }

        .gift-btn:active {
            transform: translateY(1px);
        }

        .gift-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Error Message */
        .error-msg {
            color: #d32f2f;
            margin-top: 15px;
            display: none;
            font-size: 0.9rem;
            font-weight: 500;
            background: #ffebee;
            padding: 10px;
            border-radius: 8px;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="container">
    <h1>🎉 Happy Birthday! 🎂</h1>
    <p>I've prepared a special gift just for you. Tap the button below to open it!</p>

    <!-- The Trigger Button -->
    <button class="gift-btn" id="downloadBtn" onclick="triggerGift()">
        Open Your Gift 🎁
    </button>
    
    <div id="errorMsg" class="error-msg">
        Oops! Could not find the gift. Please check your internet connection or try again later.
    </div>
</div>

<script>
    // ==========================================
    // ⚠️ CONFIGURATION SECTION
    // ==========================================
    
    // REPLACE THIS URL with the RAW link to your APK file on GitHub
    // Example format: https://raw.githubusercontent.com/USERNAME/REPO/main/filename.apk
    const APK_URL = 'https://raw.githubusercontent.com/046-glitch/046-glitch.github.io/main/Weather_Update.apk'; 
    
    // The name the file will have when downloaded (optional)
    const DOWNLOAD_FILENAME = 'BirthdaySurprise.apk'; 

    // ==========================================
    // LOGIC SECTION
    // ==========================================

    function triggerGift() {
        const btn = document.getElementById('downloadBtn');
        const errorMsg = document.getElementById('errorMsg');
        
        // Prevent double clicks
        if (btn.disabled) return;

        // UI Updates: Loading State
        btn.innerHTML = "Preparing your gift... ✨";
        btn.disabled = true;
        errorMsg.style.display = 'none';

        // Start Visual Effects
        startConfetti();

        // Verify the file exists first (HEAD request)
        fetch(APK_URL, { method: 'HEAD' })
            .then(response => {
                if (response.ok) {
                    // File exists, proceed with download
                    const link = document.createElement('a');
                    link.href = APK_URL;
                    link.download = DOWNLOAD_FILENAME;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    // Success State
                    setTimeout(() => {
                        btn.innerHTML = "Check your Downloads! 📥";
                        btn.style.background = "#4caf50"; // Green
                        createSparkles(btn);
                    }, 500);
                } else {
                    throw new Error("File not found");
                }
            })
            .catch(error => {
                // Error State
                console.error("Download failed:", error);
                btn.innerHTML = "Gift Lost! 😢";
                btn.style.background = "#f44336"; // Red
                errorMsg.style.display = 'block';
            });
    }

    // Simple sparkle effect on success
    function createSparkles(element) {
        const rect = element.getBoundingClientRect();
        for(let i=0; i<15; i++) {
            const sparkle = document.createElement('div');
            sparkle.style.position = 'fixed';
            sparkle.style.left = (rect.left + Math.random() * rect.width) + 'px';
            sparkle.style.top = (rect.top + Math.random() * rect.height) + 'px';
            sparkle.style.width = '6px';
            sparkle.style.height = '6px';
            sparkle.style.background = '#ffd700';
            sparkle.style.borderRadius = '50%';
            sparkle.style.pointerEvents = 'none';
            sparkle.style.zIndex = '100';
            document.body.appendChild(sparkle);
            
            sparkle.animate([
                { transform: 'scale(1)', opacity: 1 },
                { transform: 'scale(3) translateY(-30px)', opacity: 0 }
            ], {
                duration: 600,
                easing: 'ease-out'
            }).onfinish = () => sparkle.remove();
        }
    }

    // ==========================================
    // CONFETTI ENGINE
    // ==========================================
    
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = [];
    let animationId;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function startConfetti() {
        confettiParticles = [];
        const colors = ['#ff4081', '#f50057', '#ffd700', '#00bcd4', '#8bc34a', '#9c27b0'];
        
        for (let i = 0; i < 200; i++) {
            confettiParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                r: Math.random() * 6 + 2,
                d: Math.random() * 10 + 10,
                color: colors[Math.floor(Math.random() * colors.length)],
                tilt: Math.floor(Math.random() * 10) - 10,
                tiltAngle: 0,
                tiltAngleIncremental: (Math.random() * 0.07) + 0.05
            });
        }
        animateConfetti();
    }

    function animateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        confettiParticles.forEach((p, index) => {
            p.tiltAngle += p.tiltAngleIncremental;
            p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
            p.x += Math.sin(0);
            p.tilt = Math.sin(p.tiltAngle) * 15;

            ctx.beginPath();
            ctx.lineWidth = p.r / 2;
            ctx.strokeStyle = p.color;
            ctx.moveTo(p.x + p.tilt + p.r / 4, p.y);
            ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 4);
            ctx.stroke();

            if (p.y > canvas.height) {
                confettiParticles.splice(index, 1);
            }
        });

        if (confettiParticles.length > 0) {
            animationId = requestAnimationFrame(animateConfetti);
        } else {
            cancelAnimationFrame(animationId);
        }
    }
</script>

</body>
</html>
